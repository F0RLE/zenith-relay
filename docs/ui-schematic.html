<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenith Relay UI</title>
  <style>
    :root {
      color-scheme: light;
      --app-bg: #f5f7f8;
      --surface: #ffffff;
      --surface-subtle: #fafbfc;
      --surface-raised: #ffffff;
      --border: #d9dee3;
      --border-strong: #bdc6ce;
      --text: #182026;
      --text-secondary: #46515a;
      --muted: #707b84;
      --disabled: #a3abb2;
      --accent: #0e9f77;
      --accent-hover: #0b8564;
      --accent-soft: #e5f6f0;
      --focus: #2fc69e;
      --ready: #087a55;
      --ready-bg: #e4f5ed;
      --warning: #986801;
      --warning-bg: #fff4d6;
      --error: #b42318;
      --error-bg: #fdeceb;
      --info: #175cd3;
      --info-bg: #eaf2ff;
      --shadow: 0 12px 30px rgba(22, 32, 39, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --app-bg: #111315;
      --surface: #191c1f;
      --surface-subtle: #1f2327;
      --surface-raised: #22272b;
      --border: #30363b;
      --border-strong: #464e55;
      --text: #f2f4f5;
      --text-secondary: #c9ced2;
      --muted: #929aa1;
      --disabled: #626970;
      --accent: #2ab38e;
      --accent-hover: #38c7a0;
      --accent-soft: #153a31;
      --focus: #4bd5af;
      --ready: #6ed5ad;
      --ready-bg: #17362c;
      --warning: #f0bf57;
      --warning-bg: #3b3018;
      --error: #ff8b82;
      --error-bg: #3c2222;
      --info: #84adff;
      --info-bg: #1c2e4b;
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
      letter-spacing: 0;
    }

    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      height: 100%;
      min-width: 840px;
      min-height: 560px;
      display: grid;
      grid-template-rows: 36px minmax(0, 1fr);
      background: var(--app-bg);
    }

    .titlebar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      user-select: none;
    }

    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 216px;
      height: 100%;
      padding: 0 14px;
      font-weight: 650;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 800;
    }

    .drag-region { flex: 1; height: 100%; }

    .window-actions {
      height: 100%;
      display: flex;
      align-items: stretch;
    }

    .window-action {
      width: 46px;
      border: 0;
      border-left: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
    }

    .window-action:hover { background: var(--surface-subtle); }
    .window-action.close:hover { background: #d92d20; color: white; }
    .window-action svg { width: 14px; height: 14px; }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 216px minmax(0, 1fr);
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      padding: 12px 10px 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .mode-select {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-subtle);
      color: var(--text);
      font-weight: 600;
      appearance: none;
    }

    .mode-select option { color: var(--text); }

    .mode-wrap { position: relative; }
    .mode-wrap > svg:first-child {
      position: absolute;
      left: 10px;
      top: 9px;
      width: 18px;
      height: 18px;
      color: var(--accent);
      pointer-events: none;
    }
    .mode-wrap > svg:last-child {
      position: absolute;
      right: 9px;
      top: 10px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: auto;
    }

    .nav-button {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-weight: 520;
    }

    .nav-button svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .nav-button:hover { background: var(--surface-subtle); color: var(--text); }
    .nav-button.active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 650; }

    .sidebar-bottom {
      padding-top: 9px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 4px;
    }

    .version-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
    }

    .page-header {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .page-heading { min-width: 0; }
    .page-heading h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 650; }
    .page-heading p {
      margin: 1px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

    .content {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px 24px;
    }

    .stack { display: grid; gap: 14px; }
    .split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 14px; }
    .surface { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .section { padding: 16px; }
    .section + .section { border-top: 1px solid var(--border); }

    .section-head {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-head h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 650; }
    .section-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    .btn {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 560;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--border-strong); background: var(--surface-subtle); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .btn.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
    .btn.danger { border-color: #d92d20; color: #b42318; background: transparent; }
    html[data-theme="dark"] .btn.danger { color: #ff8b82; }
    .btn.icon { width: 32px; padding: 0; }
    .btn svg { width: 16px; height: 16px; }
    .icon-fallback {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      font-style: normal;
      font-size: 13px;
      line-height: 1;
    }
    .btn:disabled { opacity: .48; cursor: default; }

    .status-strip {
      min-height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text-secondary);
      overflow: hidden;
    }

    .status-strip .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ready); box-shadow: 0 0 0 3px var(--ready-bg); }
    .status-dot.warning { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-bg); }
    .status-dot.error { background: var(--error); box-shadow: 0 0 0 3px var(--error-bg); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .metric { min-width: 0; padding: 13px 15px; border-right: 1px solid var(--border); }
    .metric:last-child { border-right: 0; }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 4px; font-size: 19px; line-height: 24px; font-weight: 650; }
    .metric small { display: block; margin-top: 2px; color: var(--text-secondary); font-size: 11px; }

    .badge {
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.ready { color: var(--ready); background: var(--ready-bg); }
    .badge.warning { color: var(--warning); background: var(--warning-bg); }
    .badge.error { color: var(--error); background: var(--error-bg); }
    .badge.info { color: var(--info); background: var(--info-bg); }
    .badge.neutral { color: var(--text-secondary); background: var(--surface-subtle); border: 1px solid var(--border); }
    .badge svg { width: 13px; height: 13px; }

    .endpoint-band {
      min-height: 64px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .endpoint-band > div:first-child { flex: 1; min-width: 0; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 650; text-transform: uppercase; }
    code, .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .endpoint-value { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

    .tabs {
      min-height: 38px;
      padding: 0 4px;
      display: flex;
      align-items: end;
      gap: 2px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      flex: 0 0 auto;
      height: 37px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 560;
    }
    .tab:hover { color: var(--text); }
    .tab.active { border-bottom-color: var(--accent); color: var(--text); }

    .toolbar {
      min-height: 48px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }
    .toolbar .spacer { flex: 1; }

    .input, .select {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
    }
    .input { min-width: 220px; }
    .input::placeholder { color: var(--muted); }

    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      height: 46px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }
    tbody tr { background: var(--surface); }
    tbody tr:hover { background: var(--surface-subtle); }
    tbody tr.selected { background: var(--accent-soft); }
    tbody tr:last-child td { border-bottom: 0; }
    .cell-title { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .cell-sub { margin-top: 2px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
    .wake-table td { height: 58px; white-space: normal; }
    .wake-table .cell-title, .wake-table .cell-sub { white-space: normal; overflow: visible; text-overflow: clip; }

    .quota { display: grid; gap: 4px; }
    .quota-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
    .bar { height: 6px; overflow: hidden; border-radius: 999px; background: var(--border); }
    .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .bar.low > i { background: var(--warning); }

    .activity-list { display: grid; }
    .activity-row {
      min-height: 46px;
      padding: 8px 0;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .activity-row:last-child { border-bottom: 0; }
    .activity-icon { color: var(--muted); display: grid; place-items: center; }
    .activity-icon svg { width: 16px; height: 16px; }
    .activity-time { color: var(--muted); font-size: 11px; }

    .code-block {
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-subtle);
      line-height: 1.6;
    }

    .profile-grid {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
    }

    .profile-pane { min-width: 0; }
    .profile-pane + .profile-pane { border-left: 1px solid var(--border); }

    .form-grid { display: grid; gap: 14px; max-width: 760px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; font-weight: 600; }
    .field small { color: var(--muted); }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field .input, .field .select { width: 100%; min-width: 0; }

    .toggle-line {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .toggle-line:last-child { border-bottom: 0; }
    .switch { width: 34px; height: 20px; padding: 2px; border: 0; border-radius: 999px; background: var(--border-strong); }
    .switch::after { content: ""; display: block; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform .16s ease; }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(14px); }

    .empty {
      min-height: 260px;
      padding: 24px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }
    .empty svg { width: 28px; height: 28px; margin-bottom: 8px; }
    .empty strong { display: block; color: var(--text); font-size: 14px; }
    .empty p { max-width: 380px; margin: 6px auto 14px; }

    dialog {
      width: min(680px, calc(100vw - 40px));
      max-height: calc(100vh - 48px);
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface-raised);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(8, 12, 15, .48); }
    .dialog-head, .dialog-foot { min-height: 52px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .dialog-head { border-bottom: 1px solid var(--border); }
    .dialog-head strong { flex: 1; font-size: 15px; }
    .dialog-body { padding: 16px; }
    .dialog-foot { justify-content: flex-end; border-top: 1px solid var(--border); }
    .choice-list { display: grid; gap: 8px; }
    .choice {
      width: 100%;
      min-height: 54px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }
    .choice:hover { border-color: var(--accent); background: var(--accent-soft); }
    .choice svg { width: 18px; height: 18px; color: var(--accent); }
    .choice small { display: block; margin-top: 2px; color: var(--muted); }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      min-width: 260px;
      max-width: 380px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface-raised);
      color: var(--text);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 9px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast svg { width: 17px; height: 17px; color: var(--ready); }

    [hidden] { display: none !important; }

    .onboarding {
      min-width: 0;
      min-height: 0;
      padding: 24px;
      overflow: auto;
      display: grid;
      place-items: center;
    }

    .setup-shell {
      width: min(920px, 100%);
      min-height: 570px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .setup-top,
    .setup-progress,
    .setup-footer {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .setup-top { grid-row: 1; }
    .setup-progress { grid-row: 2; }
    .setup-body { grid-row: 3; }
    .setup-footer { grid-row: 4; }

    .setup-top strong { flex: 1; font-size: 14px; }
    .setup-language { width: 150px; }

    .setup-progress {
      padding-top: 10px;
      padding-bottom: 10px;
      justify-content: center;
      background: var(--surface-subtle);
    }

    .setup-step {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .setup-step + .setup-step::before {
      content: "";
      width: 36px;
      height: 1px;
      margin-right: 3px;
      background: var(--border-strong);
    }

    .setup-step-index {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      background: var(--surface);
      font-weight: 650;
    }

    .setup-step.active { color: var(--text); font-weight: 600; }
    .setup-step.active .setup-step-index { border-color: var(--accent); background: var(--accent); color: white; }
    .setup-step.done .setup-step-index { border-color: var(--ready); color: var(--ready); }

    .setup-body {
      min-width: 0;
      padding: 28px 32px;
      overflow: auto;
      animation: setup-in .18s ease;
    }

    @keyframes setup-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .setup-heading { max-width: 680px; margin-bottom: 22px; }
    .setup-heading h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 650; }
    .setup-heading p { margin: 6px 0 0; color: var(--text-secondary); line-height: 20px; }

    .welcome-view {
      min-height: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .welcome-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-size: 18px;
      font-weight: 750;
    }

    .welcome-copy { max-width: 650px; }
    .welcome-copy h1 { margin: 0; font-size: 26px; line-height: 34px; font-weight: 680; }
    .welcome-copy p { margin: 8px 0 0; color: var(--text-secondary); line-height: 21px; }
    .welcome-view .setup-flow { width: min(520px, 100%); align-self: auto; }
    .welcome-view .setup-flow-line::after {
      content: "";
      position: absolute;
      top: -3px;
      left: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: setup-flow 1.8s ease-in-out infinite;
    }

    .welcome-points {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .welcome-point { padding: 14px 16px; text-align: left; }
    .welcome-point + .welcome-point { border-left: 1px solid var(--border); }
    .welcome-point strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .welcome-point span { color: var(--muted); font-size: 12px; line-height: 17px; }

    .setup-choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .setup-choice {
      min-width: 0;
      min-height: 210px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      display: grid;
      grid-template-rows: auto auto minmax(42px, auto) 1fr;
      gap: 10px;
      text-align: left;
    }

    .setup-choice:hover { border-color: var(--border-strong); background: var(--surface-subtle); }
    .setup-choice.selected { border-color: var(--accent); background: var(--accent-soft); }
    .setup-choice-icon { width: 34px; height: 34px; display: grid; place-items: center; color: var(--accent-hover); }
    .setup-choice-icon svg { width: 24px; height: 24px; }
    .setup-choice strong { font-size: 14px; }
    .setup-choice p { margin: 0; color: var(--text-secondary); line-height: 19px; }

    .setup-flow {
      align-self: end;
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(18px, 1fr) auto minmax(18px, 1fr) auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .setup-flow-node { display: grid; justify-items: center; gap: 4px; }
    .setup-flow-node svg { width: 17px; height: 17px; }
    .setup-flow-line { position: relative; height: 1px; background: var(--border-strong); }
    .setup-choice.selected .setup-flow-line::after {
      content: "";
      position: absolute;
      top: -3px;
      left: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: setup-flow 1.8s ease-in-out infinite;
    }

    @keyframes setup-flow {
      0%, 15% { left: 0; opacity: 0; }
      30% { opacity: 1; }
      75% { left: calc(100% - 7px); opacity: 1; }
      100% { left: calc(100% - 7px); opacity: 0; }
    }

    .setup-option-list { display: grid; gap: 9px; max-width: 720px; }
    .setup-option {
      width: 100%;
      min-height: 58px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
    }
    .setup-option:hover { border-color: var(--border-strong); background: var(--surface-subtle); }
    .setup-option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .setup-option > svg { width: 20px; height: 20px; color: var(--accent-hover); flex: 0 0 auto; }
    .setup-option div { flex: 1; min-width: 0; }
    .setup-option small { display: block; margin-top: 3px; color: var(--muted); }

    .setup-form { max-width: 620px; display: grid; gap: 14px; }
    .setup-field { display: grid; gap: 6px; }
    .setup-field label { font-size: 12px; font-weight: 600; }
    .setup-field-row { display: flex; gap: 8px; }
    .setup-field-row .input { flex: 1; min-width: 0; }

    .setup-check-list { max-width: 640px; display: grid; }
    .setup-check-row {
      min-height: 52px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      animation: setup-in .22s ease both;
    }
    .setup-check-row:last-child { border-bottom: 0; }
    .setup-check-icon { color: var(--ready); display: grid; place-items: center; }
    .setup-check-icon svg { width: 17px; height: 17px; }

    .setup-client-grid { max-width: 760px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .setup-client-grid .setup-option { min-height: 74px; }

    .setup-summary { max-width: 680px; display: grid; gap: 12px; }
    .setup-success { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--ready-bg); color: var(--ready); }
    .setup-success svg { width: 26px; height: 26px; }

    .setup-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      border-bottom: 0;
    }
    .setup-footer .spacer { flex: 1; }

    .screen-only { display: none; }

    @media (max-width: 1023px) {
      .workspace { grid-template-columns: 56px minmax(0, 1fr); }
      .titlebar-brand { min-width: 56px; width: 56px; padding: 0; justify-content: center; }
      .titlebar-brand span:last-child { display: none; }
      .sidebar { padding: 12px 7px 10px; }
      .mode-select { width: 42px; padding: 0; color: transparent; }
      .mode-wrap > svg:first-child { left: 12px; }
      .mode-wrap > svg:last-child { display: none; }
      .nav-button { width: 42px; padding: 0; justify-content: center; }
      .nav-button span { display: none; }
      .version-line { display: none; }
      .split { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .field-row { grid-template-columns: 1fr; }
      .page-header { padding: 0 14px; }
      .content { padding: 14px 14px 20px; }
      .status-extra { display: none; }
      .toolbar .spacer { display: none; }
      .toolbar .input { flex: 1 1 220px; }
      .profile-grid { grid-template-columns: 1fr; }
      .profile-pane + .profile-pane { border-left: 0; border-top: 1px solid var(--border); }
      .onboarding { padding: 14px; }
      .setup-shell { min-height: 480px; }
      .setup-body { padding: 22px; }
      .setup-step span:last-child { display: none; }
      .setup-step + .setup-step::before { width: 48px; }
    }

    @media (max-width: 760px) {
      .setup-choice-grid, .setup-client-grid { grid-template-columns: 1fr; }
      .setup-choice { min-height: 160px; }
      .setup-top { flex-wrap: wrap; }
      .setup-language { width: 100%; }
      .welcome-points { grid-template-columns: 1fr; }
      .welcome-point + .welcome-point { border-left: 0; border-top: 1px solid var(--border); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="titlebar-brand"><span class="brand-mark">Z</span><span>Zenith Relay</span></div>
      <div class="drag-region"></div>

        <button class="window-action" title="Свернуть" data-action="window"><i data-lucide="minus"></i></button>
        <button class="window-action" title="Развернуть" data-action="window"><i data-lucide="square"></i></button>
        <button class="window-action close" title="Закрыть" data-action="window"><i data-lucide="x"></i></button>
      </div>
    </header>

    <section class="onboarding" id="onboarding">
      <div class="setup-shell">
        <div class="setup-top">

            <option value="ru" selected>Русский</option>
            <option value="en">English</option>
          </select>
          <button type="button" class="btn ghost" id="setupSkip" data-setup-action="skip">Пропустить</button>

        <div class="setup-progress" id="setupProgress"></div>
        <div class="setup-body" id="setupBody"></div>
        <div class="setup-footer">
          <button type="button" class="btn ghost" id="setupBack" data-setup-action="back">Назад</button>
          <span class="spacer"></span>
          <button type="button" class="btn primary" id="setupNext" data-setup-action="next">Продолжить</button>
        </div>
      </div>
    </section>

    <div class="workspace" id="workspace" hidden>
      <aside class="sidebar">
        <div class="mode-wrap">
          <i data-lucide="layers-3"></i>
          <select class="mode-select" id="modeSelect" aria-label="Режим" title="Этот компьютер">
            <option value="local" selected>Этот компьютер</option>
            <option value="remote">Мой сервер</option>
            <option value="zenith">Готовый API</option>
          </select>
          <i data-lucide="chevrons-up-down"></i>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-bottom">
          <button class="nav-button" data-action="docs" title="Документация"><i data-lucide="book-open"></i><span>Документация</span></button>
          <button class="nav-button" data-action="theme" title="Сменить тему"><i data-lucide="sun-moon"></i><span>Сменить тему</span></button>
          <div class="version-line"><span>Zenith Relay</span><span>v1.1</span></div>
        </div>
      </aside>

      <main class="main">
        <header class="page-header">
          <div class="page-heading"><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div>
          <div class="header-actions" id="headerActions"></div>
        </header>
        <section class="content" id="content"></section>
      </main>
    </div>
  </div>

  <dialog id="actionDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><strong id="dialogTitle">Добавить подключение</strong><button type="button" class="btn icon ghost" data-action="close-dialog" title="Закрыть" aria-label="Закрыть"><i data-lucide="x"></i></button></div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-foot"><button class="btn" data-action="close-dialog">Отмена</button></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><i data-lucide="circle-check"></i><span id="toastText">Готово</span></div>

  <script async src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" onload="window.refreshZenithIcons && window.refreshZenithIcons()"></script>
  <script>
    const screens = [
      { id: "overview", label: "Обзор", icon: "layout-dashboard" },

    const nav = document.getElementById("nav");

    const dialogBody = document.getElementById("dialogBody");
    const toast = document.getElementById("toast");
    const toastText = document.getElementById("toastText");
    let toastTimer;

    const icon = (name) => `<i data-lucide="${name}"></i>`;
    const badge = (text, tone = "neutral", name = "circle") => `<span class="badge ${tone}">${icon(name)}${text}</span>`;
    const actionLabels = {
      "copy-endpoint": "Копировать адрес",
      "copy-key": "Копировать ключ",
      "copy-config": "Копировать конфигурацию",
      refresh: "Обновить",
      "row-menu": "Открыть меню",
      "request-detail": "Открыть детали",
      "close-dialog": "Закрыть"
    };
    const fallbackIcons = {
      minus: "-",
      square: "□",
      x: "×",
      plus: "+",
      copy: "⧉",
      check: "✓",
      "circle-check": "✓",
      "arrow-right": "→",
      "chevrons-up-down": "↕",
      ellipsis: "⋯",
      play: "▶",
      "refresh-cw": "↻",
      upload: "↑",
      download: "↓",
      history: "↶"
    };
    const button = (label, action, kind = "", iconName = "") => {
      const accessibleLabel = label || actionLabels[action] || "Выполнить действие";
      const iconOnly = kind.split(" ").includes("icon");
      const accessibility = iconOnly ? ` aria-label="${accessibleLabel}" title="${accessibleLabel}"` : "";
      return `<button type="button" class="btn ${kind}" data-action="${action}"${accessibility}>${iconName ? icon(iconName) : ""}${label ? `<span>${label}</span>` : ""}</button>`;
    };

    function refreshIcons() {
      if (window.lucide) {
        window.lucide.createIcons({ attrs: { "stroke-width": 1.9 } });
        return;
      }
      document.querySelectorAll("i[data-lucide]").forEach((element) => {
        element.classList.add("icon-fallback");
        element.textContent = fallbackIcons[element.dataset.lucide] || "•";
        element.setAttribute("aria-hidden", "true");
      });
    }
    window.refreshZenithIcons = refreshIcons;

    function showToast(text) {
      clearTimeout(toastTimer);
      toastText.textContent = text;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      refreshIcons();
    }

    function setDialog(title, body) {
      dialogTitle.textContent = title;
      dialogBody.innerHTML = body;
      dialog.showModal();

    function setupFlow(nodes) {
      return `<div class="setup-flow">${nodes.map((node, index) => `${index ? '<span class="setup-flow-line"></span>' : ""}<span class="setup-flow-node">${icon(node[1])}<span>${node[0]}</span></span>`).join("")}</div>`;
    }

    function setupIntroView(copy) {
      const ru = setupState.language === "ru";
      const flow = ru
        ? [["Аккаунты", "users"], ["Zenith Relay", "route"], ["Приложения", "blocks"]]
        : [["Accounts", "users"], ["Zenith Relay", "route"], ["Applications", "blocks"]];
      return `<div class="welcome-view"><span class="welcome-mark">Z</span><div class="welcome-copy"><h1>${copy.welcomeTitle}</h1><p>${copy.welcomeText}</p></div>${setupFlow(flow)}<div class="welcome-points">${copy.welcomePoints.map((point) => `<div class="welcome-point"><strong>${point[0]}</strong><span>${point[1]}</span></div>`).join("")}</div></div>`;

    function setupModeView(copy) {
      const flows = setupState.language === "ru" ? {
        local: [["Аккаунты", "users"], ["Relay", "monitor"], ["Приложение", "terminal"]],

      } : {
        local: [["Accounts", "users"], ["Relay", "monitor"], ["Application", "terminal"]],
        remote: [["Accounts", "users"], ["Server", "server"], ["Devices", "laptop"]],

      };
      const icons = { local: "monitor-cog", remote: "server-cog", zenith: "cloud-cog" };
      return `<div class="setup-heading"><h1>${copy.modeTitle}</h1><p>${copy.modeText}</p></div><div class="setup-choice-grid">${["local", "remote", "zenith"].map((mode) => `<button type="button" class="setup-choice ${setupState.mode === mode ? "selected" : ""}" data-setup-mode="${mode}"><span class="setup-choice-icon">${icon(icons[mode])}</span><strong>${copy.modes[mode][0]}</strong><p>${copy.modes[mode][1]}</p>${setupFlow(flows[mode])}</button>`).join("")}</div>`;

    function setupConnectionView(copy) {
      const ru = setupState.language === "ru";
      let content;
      let title;
      let description;
      if (setupState.mode === "zenith") {
        title = ru ? "Выберите готовый API" : "Choose a ready API";

      return `<div class="section"><div class="section-head"><div><h2>Резервные копии Codex Main</h2><p>Перед восстановлением будет показана разница</p></div>${badge("3 копии", "info", "archive")}</div><div class="table-wrap"><table><thead><tr><th style="width:100px">Выбор</th><th>Создана</th><th>Причина</th><th style="width:140px">Конфигурация</th><th style="width:120px">Состояние</th></tr></thead><tbody><tr class="selected"><td>${badge("Выбрана", "info", "check")}</td><td>Сегодня, 13:42</td><td>Перед сменой эндпоинта</td><td>Codex Main</td><td>${badge("Готова", "ready", "circle-check")}</td></tr><tr><td></td><td>Вчера, 19:08</td><td>Перед обновлением</td><td>Codex Main</td><td>${badge("Готова", "ready", "circle-check")}</td></tr><tr><td></td><td>7 июля, 10:16</td><td>Ручное сохранение</td><td>OpenCode Work</td><td>${badge("Готова", "ready", "circle-check")}</td></tr></tbody></table></div></div>`;
    }

    function profileRepairView() {
      return `<div class="section"><div class="section-head"><div><h2>Проверка профилей</h2><p>Изменения применяются только после предварительного просмотра</p></div>${badge("Проблем не найдено", "ready", "shield-check")}</div><div class="activity-list"><div class="activity-row"><span class="activity-icon">${icon("file-check-2")}</span><div><strong>Конфигурации клиентов</strong><div class="cell-sub">Пути, формат и активный эндпоинт</div></div>${button("Проверить", "scan-profiles", "", "scan-search")}</div><div class="activity-row"><span class="activity-icon">${icon("history")}</span><div><strong>История сессий</strong><div class="cell-sub">Связь старых сессий с текущим профилем</div></div>${button("Просмотреть", "repair-history", "", "arrow-right")}</div><div class="activity-row"><span class="activity-icon">${icon("archive-restore")}</span><div><strong>Карантин файлов</strong><div class="cell-sub">Повреждённые файлы не удаляются автоматически</div></div>${button("Открыть", "open-quarantine", "", "folder-open")}</div></div></div>`;
    }
    function renderSettings() {
      const items = [["general", "Основные"], ["appearance", "Внешний вид"], ["storage", "Хранилище"], ["updates", "Обновления"], ["security", "Безопасность"], ["recovery", "Восстановление"]];
      return `<div class="surface">${tabs(items, state.tabs.settings, "settings")}<div class="section">${settingsBody()}</div></div>`;
    }

    function settingsBody() {
      if (state.tabs.settings === "appearance") return `<div class="form-grid"><div class="field"><label>Тема</label><select class="select" id="themeSelect"><option value="system">Как в системе</option><option value="light" ${state.theme === "light" ? "selected" : ""}>Светлая</option><option value="dark" ${state.theme === "dark" ? "selected" : ""}>Тёмная</option></select></div><div class="field"><label>Плотность таблиц</label><select class="select"><option>Обычная</option><option>Компактная</option></select></div></div>`;
      if (state.tabs.settings === "storage") return `<div class="form-grid"><div class="field"><label>Папка данных</label><div style="display:flex;gap:8px"><input class="input mono" value="C:\\Users\\User\\AppData\\Roaming\\Zenith Relay" readonly>${button("Открыть", "open-folder", "", "folder-open")}</div></div><div class="field"><label>Хранение журналов</label><select class="select"><option>30 дней</option><option>90 дней</option><option>Не удалять автоматически</option></select></div></div>`;
      if (state.tabs.settings === "updates") return `<div class="activity-list"><div class="activity-row"><span class="activity-icon">${icon("package-check")}</span><div><strong>Версия 1.1.0</strong><div class="cell-sub">Стабильный канал</div></div>${button("Проверить", "refresh", "", "refresh-cw")}</div></div>`;
      if (state.tabs.settings === "security") return `<div class="toggle-line"><div><strong>Системное хранилище секретов</strong><div class="cell-sub">Доступно и используется</div></div>${badge("Защищено", "ready", "shield-check")}</div><div class="toggle-line"><div><strong>Скрывать секрет через</strong><div class="cell-sub">Время временного показа ключа</div></div><select class="select"><option>30 секунд</option><option>60 секунд</option></select></div>`;
      if (state.tabs.settings === "recovery") return `<div class="activity-list"><div class="activity-row"><span class="activity-icon">${icon("archive-restore")}</span><div><strong>Резервные копии профилей</strong><div class="cell-sub">2 доступные копии</div></div>${button("Открыть", "open-backups", "", "arrow-right")}</div><div class="activity-row"><span class="activity-icon">${icon("rotate-ccw")}</span><div><strong>Сбросить локальные данные</strong><div class="cell-sub">Подключения и секреты будут удалены</div></div>${button("Сбросить", "reset-data", "danger", "trash-2")}</div></div>`;
      return `<div class="form-grid"><div class="field-row"><div class="field"><label>Язык</label><select class="select"><option>Русский</option><option>English</option></select></div><div class="field"><label>Режим по умолчанию</label><select class="select"><option>${activeModeData().label}</option><option>Этот компьютер</option><option>Мой сервер</option><option>Готовый API</option></select></div></div><div class="toggle-line"><div><strong>Запускать вместе с системой</strong><div class="cell-sub">Открывать Zenith Relay после входа</div></div><button type="button" class="switch" data-action="toggle" aria-label="Запускать вместе с системой" aria-pressed="false"></button></div><div class="toggle-line"><div><strong>Быстрая настройка</strong><div class="cell-sub">Повторно выбрать режим, подключение и приложение</div></div>${button("Запустить", "start-onboarding", "", "sparkles")}</div><div style="display:flex;justify-content:flex-end;margin-top:16px">${button("Сохранить", "save-settings", "primary", "check")}</div></div>`;
    }

    function connectionChoices() {
      if (state.mode === "zenith") return `<div class="choice-list"><button type="button" class="choice" data-action="choice">${icon("sparkles")}<div><strong>Zenith API</strong><small>Рекомендуется · готовый каталог моделей и баланс</small></div></button><button type="button" class="choice" data-action="choice">${icon("plug")}<div><strong>Другой совместимый API</strong><small>Подключить собственный адрес API и ключ</small></div></button></div>`;
      return `<div class="choice-list"><button type="button" class="choice" data-action="choice">${icon("log-in")}<div><strong>Войти через OAuth</strong><small>Добавить ещё один личный аккаунт</small></div></button><button type="button" class="choice" data-action="choice">${icon("file-json")}<div><strong>Импортировать сессию</strong><small>Сначала будет показан предварительный просмотр</small></div></button><button type="button" class="choice" data-action="choice">${icon("plug")}<div><strong>Добавить API-подключение</strong><small>Необязательно · адрес API, ключ и протокол</small></div></button><button type="button" class="choice" data-action="choice">${icon("orbit")}<div><strong>OpenRouter</strong><small>Готовый шаблон подключения</small></div></button>${state.mode === "remote" ? `<button type="button" class="choice" data-action="choice">${icon("server")}<div><strong>Сервер Relay</strong><small>Подключить или развернуть свой сервер</small></div></button>` : ""}</div>`;
    }

    setupLanguage.addEventListener("change", () => {
      setupState.language = setupLanguage.value;
      document.documentElement.lang = setupState.language;
      renderSetup();
    });

    onboarding.addEventListener("click", (event) => {
      const modeChoice = event.target.closest("[data-setup-mode]");
      if (modeChoice) {
        event.stopPropagation();
        setupState.mode = modeChoice.dataset.setupMode;
        renderSetup();
        return;
      }

      const connectionChoice = event.target.closest("[data-setup-connection]");
      if (connectionChoice) {
        event.stopPropagation();
        setupState.connection = connectionChoice.dataset.setupConnection;
        renderSetup();
        return;
      }

      const directChoice = event.target.closest("[data-setup-direct]");
      if (directChoice) {
        event.stopPropagation();
        setupState.directSource = directChoice.dataset.setupDirect;
        renderSetup();
        return;
      }

      const remoteChoice = event.target.closest("[data-setup-remote]");
      if (remoteChoice) {
        event.stopPropagation();
        setupState.remoteMethod = remoteChoice.dataset.setupRemote;
        renderSetup();
        return;
      }

      const clientChoice = event.target.closest("[data-setup-client]");
      if (clientChoice) {
        event.stopPropagation();
        setupState.client = clientChoice.dataset.setupClient;
        renderSetup();
        return;
      }

      const setupAction = event.target.closest("[data-setup-action]");
      if (setupAction) {
        event.stopPropagation();
        const action = setupAction.dataset.setupAction;
        if (action === "skip") {
          openWorkspace(setupState.language === "ru" ? "Настройку можно запустить снова из раздела Настройки" : "Quick setup can be opened again from Settings");
        } else if (action === "back" && setupState.step > 0) {
          setupState.step -= 1;
          renderSetup();
        } else if (action === "next") {
          if (setupState.intro) {
            setupState.intro = false;
            renderSetup();
          } else if (setupState.step < 4) {
            setupState.step += 1;
            renderSetup();
          } else {
            openWorkspace(setupState.language === "ru" ? "Быстрая настройка завершена" : "Quick setup completed");
          }
        } else if (action === "reveal") {
          const input = document.getElementById("setupKey");
          if (input) {
            input.type = input.type === "password" ? "text" : "password";
            setupAction.textContent = input.type === "password" ? (setupState.language === "ru" ? "Показать" : "Show") : (setupState.language === "ru" ? "Скрыть" : "Hide");
          }
        }
        return;
      }

      const regularAction = event.target.closest("[data-action]");
      if (regularAction) {
        event.stopPropagation();
        showToast(setupState.language === "ru" ? "Действие показано в схематике" : "This action is shown in the schematic");
      }
    });

    document.addEventListener("click", (event) => {
      const screenButton = event.target.closest("[data-screen]");
      if (screenButton) {
        state.screen = screenButton.dataset.screen;
        render();
        return;
      }

      const tabButton = event.target.closest("[data-tab-group]");
      if (tabButton) {
        state.tabs[tabButton.dataset.tabGroup] = tabButton.dataset.tab;
        render();
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.action;

      if (action === "theme") {
        state.theme = state.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = state.theme;
        render();
      } else if (action === "docs") {
        showToast("Документация открывается во внешнем браузере");
      } else if (action === "window") {
        showToast("Эта кнопка работает в приложении Tauri");
      } else if (action === "add-connection") {
        setDialog("Добавить подключение", connectionChoices());
      } else if (action === "add-wake-task") {
        setDialog("Задача пробуждения", `<div class="form-grid"><div class="field"><label>Название</label><input class="input" value="Запуск нового окна квоты"></div><div class="field"><label>Аккаунты</label><select class="select"><option>Все подходящие аккаунты (7)</option><option>Выбранные аккаунты</option><option>По тегам</option></select><small>Недоступные и уже использованные в новом цикле аккаунты будут пропущены.</small></div><div class="toggle-line"><div><strong>5-часовое окно</strong><div class="cell-sub">Показывается только при подтверждённом сопоставлении провайдера</div></div><button type="button" class="switch on" data-action="toggle" aria-label="5-часовое окно" aria-pressed="true"></button></div><div class="toggle-line"><div><strong>Недельное окно</strong><div class="cell-sub">Пробуждать после полного восстановления</div></div><button type="button" class="switch on" data-action="toggle" aria-label="Недельное окно" aria-pressed="true"></button></div><div class="field-row"><div class="field"><label>Модель</label><select class="select"><option>Легчайшая доступная</option><option>gpt-5.4-mini</option><option>gpt-5.6-luna</option></select></div><div class="field"><label>Запуск</label><select class="select"><option>После восстановления квоты</option><option>Ежедневно</option><option>Еженедельно</option><option>По интервалу</option></select></div></div><div class="field-row"><div class="field"><label>Режим</label><select class="select"><option>Автоматически</option><option>Требовать подтверждение</option></select></div><div class="field"><label>Случайная задержка</label><select class="select"><option>0-3 минуты</option><option>Без задержки</option><option>0-15 минут</option></select></div></div><div class="status-strip">${icon("shield-check")}<strong>Минимальный запрос</strong><span>Без инструментов и рассуждений, с ограниченным ответом. Содержимое ответа не сохраняется.</span></div><div style="display:flex;justify-content:flex-end;gap:8px">${button("Проверить выбор", "test-wake-task", "", "play")}${button("Сохранить", "choice", "primary", "check")}</div></div>`);
      } else if (action === "wake-history") {
        setDialog("История пробуждений", `<div class="activity-list"><div class="activity-row"><span class="activity-icon">${icon("circle-check")}</span><div><strong>Запуск нового окна квоты</strong><div class="cell-sub">Сегодня, 10:07 · 7 аккаунтов · 24.6s</div></div>${badge("5 подтверждено", "ready", "circle-check")}</div><div class="activity-row"><span class="activity-icon">${icon("forward")}</span><div><strong>Обычный запрос уже начал отсчёт</strong><div class="cell-sub">2 аккаунта пропущены без дополнительного расхода</div></div>${badge("Пропущено", "info", "forward")}</div><div class="activity-row"><span class="activity-icon">${icon("circle-help")}</span><div><strong>Отсчёт не подтверждён</strong><div class="cell-sub">Вчера, 21:37 · повтор не выполнялся</div></div>${badge("1 аккаунт", "warning", "triangle-alert")}</div></div><div class="status-strip" style="margin-top:14px">${icon("shield-check")}<strong>Приватность</strong><span>История не содержит промпты и ответы модели.</span></div>`);
      } else if (action === "import-account") {
        setDialog("Импорт аккаунта", `<div class="choice-list"><button class="choice" data-action="choice">${icon("log-in")}<div><strong>Войти через OAuth</strong><small>Открыть браузер и подтвердить вход</small></div></button><button class="choice" data-action="choice">${icon("file-json")}<div><strong>Импорт auth.json</strong><small>Сначала будет показан предварительный просмотр</small></div></button><button class="choice" data-action="choice">${icon("clipboard-paste")}<div><strong>Вставить token JSON</strong><small>Секрет не попадёт в журналы</small></div></button></div>`);
      } else if (action === "close-dialog") {
        dialog.close();
      } else if (action === "choice") {
        dialog.close();
        showToast("Открыт следующий шаг мастера");
      } else if (action === "copy-endpoint" || action === "copy-key" || action === "copy-config") {
        showToast("Скопировано");
      } else if (action === "test-wake-task") {
        showToast("Проверка выполнит не более одного минимального запроса на выбранный аккаунт");
      } else if (action === "open-gateway") {
        state.screen = "gateway";
        render();
      } else if (action === "open-pool") {
        state.screen = "pool";
        render();
      } else if (action === "open-connections") {
        state.screen = "connections";
        render();
      } else if (action === "open-usage") {
        state.screen = "usage";
        render();
      } else if (action === "open-backups") {
        state.screen = "profiles";
        state.tabs.profiles = "backups";
        render();
      } else if (action === "open-keys") {
        state.screen = "pool";
        state.tabs.pool = "keys";
        render();
      } else if (action === "toggle") {
        actionButton.classList.toggle("on");
        actionButton.setAttribute("aria-pressed", actionButton.classList.contains("on") ? "true" : "false");
      } else if (action === "row-menu") {
        setDialog("Действия", `<div class="choice-list"><button class="choice" data-action="choice">${icon("external-link")}<div><strong>Открыть детали</strong></div></button><button class="choice" data-action="choice">${icon("activity")}<div><strong>Проверить</strong></div></button><button class="choice" data-action="choice">${icon("pencil")}<div><strong>Изменить</strong></div></button><button class="choice" data-action="choice">${icon("circle-slash")}<div><strong>Отключить</strong></div></button><button class="choice" data-action="choice">${icon("trash-2")}<div><strong>Удалить</strong><small>Потребуется подтверждение</small></div></button></div>`);
      } else if (action === "primary") {
        showToast(`${activeModeData().primary}: действие выполнено`);
      } else if (action === "add-member") {
        setDialog("Добавить участника", `<div class="choice-list"><button type="button" class="choice" data-action="choice">${icon("user-round")}<div><strong>Выбрать аккаунты</strong><small>Добавить существующие OAuth-аккаунты</small></div></button><button type="button" class="choice" data-action="choice">${icon("plug")}<div><strong>Выбрать подключения</strong><small>Добавить API-источники</small></div></button></div>`);
      } else if (action === "create-key") {
        setDialog("Создать ключ пула", `<div class="form-grid"><div class="field"><label>Название</label><input class="input" value="Новый ключ"></div><div class="field"><label>Область</label><select class="select"><option>Все участники</option><option>Выбранные участники</option></select></div></div><div style="display:flex;justify-content:flex-end;margin-top:16px">${button("Создать", "choice", "primary", "key-round")}</div>`);
      } else if (action === "add-profile") {
        setDialog("Добавить профиль", `<div class="choice-list"><button class="choice" data-action="choice">${icon("terminal")}<div><strong>Codex</strong><small>Найти или выбрать профиль</small></div></button><button class="choice" data-action="choice">${icon("code-2")}<div><strong>OpenCode</strong><small>Добавить конфигурацию клиента</small></div></button></div>`);
      } else if (action === "reset-data" || action === "disconnect") {
        setDialog("Подтвердите действие", `<p style="margin:0;color:var(--text-secondary)">Действие изменит сохранённое состояние. Перед продолжением будет создан доступный резервный шаг, если он поддерживается.</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">${button("Отмена", "close-dialog")}${button("Продолжить", "choice", "danger", "triangle-alert")}</div>`);
      } else if (action === "request-detail") {
        setDialog("Детали запроса", `<div class="activity-list"><div class="activity-row"><span class="activity-icon">${icon("route")}</span><div><strong>Попытки</strong><div class="cell-sub">Codex Backup пропущен, запрос выполнен через Codex Pro</div></div>${badge("2", "neutral", "list-ordered")}</div><div class="activity-row"><span class="activity-icon">${icon("timer")}</span><div><strong>Задержка</strong><div class="cell-sub">Первый ответ 1.4s, всего 2.4s</div></div></div><div class="activity-row"><span class="activity-icon">${icon("braces")}</span><div><strong>Токены</strong><div class="cell-sub">18 420 всего, чтение кэша 12 600</div></div></div></div>`);
      } else if (action === "start-onboarding") {
        startSetup();
      } else {
        showToast("Действие показано в схематике");
      }
    });

    modeSelect.addEventListener("change", () => {
      state.mode = modeSelect.value;
      state.screen = "overview";
      render();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const actionTarget = event.target.closest?.("[data-action]");
      if (actionTarget?.matches("tr[data-action]")) {
        event.preventDefault();
        actionTarget.click();
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target.id === "themeSelect") {
        const value = event.target.value === "system" ? "light" : event.target.value;
        state.theme = value;
        document.documentElement.dataset.theme = value;
        render();
      }
    });

    render();
    renderSetup();
  </script>
</body>
</html>
