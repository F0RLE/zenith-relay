openapi: 3.1.0
info: {title: Relay Hosted restricted text worker, version: "1"}
servers:
  - url: "http://127.0.0.1:{port}"
    description: Separate serve-text listener, never the web server.
    variables: {port: {default: "8444", description: Match the explicit worker bind.}}
security: [{inferenceKey: []}]
paths:
  /v1/models:
    get:
      operationId: listQualifiedModels
      description: Effective published model IDs in the active key's tester scope. No upstream requests.
      responses:
        "200":
          description: Empty when no current route is published.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {const: list}
                  data: {type: array, maxItems: 128, items: {type: object, required: [id, object], properties: {id: {type: string}, object: {const: model}}}}
        "401": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /v1/responses:
    post:
      operationId: createQualifiedResponse
      description: A currently published native text model. Streaming requires a separately verified supplier for this offer. Each accepted request pins its tariff, holds a bounded amount and permits at most one send. Without an idempotency key a later POST is a new request.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[!-~]+$"}
          description: Scoped to this key. Whitespace, member order and explicitly false defaults do not change request identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, input, max_output_tokens]
              properties:
                model: {type: string, maxLength: 128}
                input: {type: string, minLength: 1, description: Bounded in UTF-8 bytes by the offer.}
                max_output_tokens: {type: integer, minimum: 1, maximum: 1000000, description: Must also fit the offer.}
                store: {const: false, default: false}
                stream: {type: boolean, default: false}
      responses:
        "200":
          description: Native response, not retained for replay. A successful SSE header does not prove completion or settlement. Inspect the terminal event and use the request status for accounting.
          headers: {X-Request-Id: {$ref: "#/components/headers/RequestId"}}
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema:
                type: string
                description: Native Responses events through a matching completed or incomplete terminal. A failed or uncertain stream can end with a safe error event instead. An interrupted body is not retry permission.
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/Refusal"}
        "402": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "409":
          description: Same content returns the existing logical ID and in-progress or result-unavailable code. Different content returns a conflict without an ID. No new send.
          headers: {X-Request-Id: {$ref: "#/components/headers/RequestId"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/Failure"}}}
        "429": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /api/hosted/v1/requests/{id}/status:
    get:
      operationId: readQualifiedRequestStatus
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Safe metadata only, visible to the active originating key.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "openapi.yaml#/components/schemas/Envelope"}
                  - properties: {data: {$ref: "openapi.yaml#/components/schemas/TextReceipt"}}
        "401": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "openapi.yaml#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Refusal"}
components:
  securitySchemes:
    inferenceKey: {type: http, scheme: bearer, description: A qualification customer key, not an upstream credential or browser session.}
  headers:
    RequestId: {schema: {type: string, format: uuid}, description: The logical request, when known.}
  schemas:
    Failure:
      type: object
      required: [error]
      properties:
        error: {type: object, required: [type, code, message], properties: {type: {const: relay_error}, code: {type: string}, message: {type: string}}}
  responses:
    Refusal:
      description: Safe refusal or pending outcome. Do not resubmit an uncertain operation as a new request.
      headers: {X-Should-Retry: {schema: {const: "false"}}, X-Request-Id: {$ref: "#/components/headers/RequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/Failure"}}}
