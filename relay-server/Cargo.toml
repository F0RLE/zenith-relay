[package]
name = "zenith-relay-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.97"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = { level = "allow", priority = -1 }

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3.34"
fs2 = "0.4.3"
hex = "0.4.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
zenith-relay-core = { path = "../crates/relay-core" }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
incremental = false
