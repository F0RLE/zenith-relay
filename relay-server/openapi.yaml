        adapter:
          type: string
          default: native
          enum: [native, responses_to_chat_completions, responses_to_messages, responses_to_gemini, chat_completions_to_responses, chat_completions_to_messages, chat_completions_to_gemini, messages_to_responses, messages_to_chat_completions, messages_to_gemini, gemini_to_responses, gemini_to_chat_completions, gemini_to_messages]
        modelIds: { type: array, items: { type: string } }
        reasoningMode: { type: string, enum: [disabled, budget, adaptive] }
        cacheWriteTtl: { type: string, enum: [provider, 5m, 1h], default: provider }
    SourcePatch:
      type: object
      properties:
        name: { type: string }
        baseUrl: { type: string, format: uri }
        apiKey: { type: string, writeOnly: true }
        proxyId: { type: string, nullable: true, description: "Stored proxy used for every request of this source (generation, discovery, probe, balance, refresh). Absent keeps the current value, null removes it. A missing or invalid proxy fails the route; it never falls back to a direct connection. The proxy URL is never exposed." }
        wireApi: { $ref: "#/components/schemas/WireApi" }
        protocolBindings: { type: array, items: { $ref: "#/components/schemas/SourceProtocolBinding" } }
        models: { type: array, items: { type: string } }
    SourceInput:
      allOf:
        - { $ref: "#/components/schemas/SourcePatch" }
        - { type: object, required: [name, baseUrl, apiKey, wireApi] }
    SourceSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        proxyId: { type: string, nullable: true, readOnly: true }
        refreshRevision: { type: integer, minimum: 1, readOnly: true, description: Non-secret source incarnation and configuration scope; changes on key replacement even if the URL is unchanged. }
        refreshState: { $ref: "#/components/schemas/SourceRefreshState", readOnly: true }
        providerStats: { $ref: "#/components/schemas/SourceProviderStats", readOnly: true, description: Optional runtime-only last observation; never initiates a provider request while reading a snapshot. }
        models: { type: array, items: { type: string } }
        protocolConfig: { $ref: "#/components/schemas/SourceProtocolConfig" }
        protocolBindings: { type: array, items: { $ref: "#/components/schemas/SourceProtocolBinding" } }
        resolvedProtocolBindings: { type: array, items: { $ref: "#/components/schemas/SourceProtocolBinding" }, readOnly: true }
        detectedModelPrices:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ApiModelPriceOverride" }
          readOnly: true
        modelPriceOverrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ApiModelPriceOverride" }
    RefreshStatus:
      type: string
      enum: [unknown, fresh, stale, unsupported]
      description: Refresh evidence only, independent of inference routing. Unknown has no current-process observation; saved data is stale after restart, not fresh.
    SourceRefreshState:
      type: object
      readOnly: true
      properties:
        models: { $ref: "#/components/schemas/RefreshStatus" }
        balance: { $ref: "#/components/schemas/RefreshStatus" }
    AccountRefreshState:
      type: object
      readOnly: true
      description: Account snapshot refreshState (quota and models); absent on older servers.
      properties:
        models: { $ref: "#/components/schemas/RefreshStatus" }
        quota: { $ref: "#/components/schemas/RefreshStatus" }
    ModelProtocolRoute:
      type: object
      properties:
        clientWireApi: { $ref: "#/components/schemas/WireApi" }
        upstreamWireApi: { $ref: "#/components/schemas/WireApi" }
        features: { $ref: "#/components/schemas/ProtocolFeatures" }
        reasoningEfforts: { type: array, items: { type: string } }
    ModelSummary:
      type: object
      properties:
        id: { type: string }
        catalogContextLimit: { type: [integer, "null"], minimum: 0, readOnly: true }
        contextPolicy: { $ref: "#/components/schemas/ModelContextPolicy" }
        contextConfigurable: { type: boolean, readOnly: true }
        protocolRoutes: { type: array, items: { $ref: "#/components/schemas/ModelProtocolRoute" }, readOnly: true }
        catalogCapabilities: { $ref: "#/components/schemas/ModelCapabilities", readOnly: true }
        tokenPrice:
          oneOf:
            - { $ref: "#/components/schemas/TokenPrice" }
            - { type: "null" }
          readOnly: true
        speedTiers: { type: array, items: { $ref: "#/components/schemas/ServiceTier" }, readOnly: true }
        speedTier: { $ref: "#/components/schemas/ServiceTier" }
        speedSupported: { type: boolean, readOnly: true }
        speedConfigurable: { type: boolean, readOnly: true }
    ServiceTier:
      type: string
      enum: [standard, fast, ultrafast]
    ModelContextPolicy:
      type: string
      enum: [short, extended]
    ModelCapabilities:
      type: object
      description: Normalized reference semantics; never grants model or route access.
      properties:
        reasoning: { type: [boolean, "null"] }
        reasoningSource: { type: [string, "null"] }
        reasoningMethod: { type: [string, "null"], enum: [effort, toggle, budget_tokens, adaptive, unknown, null] }
        reasoningEffortLevels: { type: array, items: { type: string } }
        defaultReasoningEffort: { type: [string, "null"] }
        reasoningBudgetMinTokens: { type: [integer, "null"], minimum: 0 }
        reasoningBudgetMaxTokens: { type: [integer, "null"], minimum: 0 }
        reasoningBudgetDefaultTokens: { type: [integer, "null"], minimum: 0 }
        reasoningModes: { type: array, items: { type: string, enum: [standard, pro] } }
        toolCall: { type: [boolean, "null"] }
        structuredOutput: { type: [boolean, "null"] }
        attachment: { type: [boolean, "null"] }
        openWeights: { type: [boolean, "null"] }
        temperature: { type: [boolean, "null"] }
        promptCaching: { type: [boolean, "null"] }
        parallelToolCall: { type: [boolean, "null"] }
        toolChoice: { type: [boolean, "null"] }
        streaming: { type: [boolean, "null"] }
        serviceTiers: { type: array, items: { $ref: "#/components/schemas/ServiceTier" } }
        inputModalities: { type: array, items: { type: string } }
        outputModalities: { type: array, items: { type: string } }
        contextLimit: { type: [integer, "null"], minimum: 0 }
        inputLimit: { type: [integer, "null"], minimum: 0 }
        outputLimit: { type: [integer, "null"], minimum: 0 }
    TokenRateSet:
      type: object
      description: Optional microUSD rates per million tokens. An absent component remains unknown; zero is an explicit free rate.
      properties:
        input: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite5m: { type: integer, minimum: 0 }
        cacheWrite1h: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
    LongContextRates:
      type: object
      properties:
        standard: { $ref: "#/components/schemas/TokenRateSet" }
        flex: { $ref: "#/components/schemas/TokenRateSet" }
        priority: { $ref: "#/components/schemas/TokenRateSet", description: Fast schedule using the upstream priority name. }
        ultrafast: { $ref: "#/components/schemas/TokenRateSet" }
    TokenPriceSchedules:
      type: object
      description: Published tier and input-size schedules; prices never establish mode support or model access.
      properties:
        flex: { $ref: "#/components/schemas/TokenRateSet" }
        priority: { $ref: "#/components/schemas/TokenRateSet" }
        ultrafast: { $ref: "#/components/schemas/TokenRateSet" }
        above100k: { $ref: "#/components/schemas/LongContextRates" }
        above128k: { $ref: "#/components/schemas/LongContextRates" }
        above200k: { $ref: "#/components/schemas/LongContextRates" }
        above272k: { $ref: "#/components/schemas/LongContextRates" }
        above512k: { $ref: "#/components/schemas/LongContextRates" }
    TokenPrice:
      allOf:
        - { $ref: "#/components/schemas/TokenRateSet" }
        - { $ref: "#/components/schemas/TokenPriceSchedules" }
        - { type: object, required: [input, output] }
    ApiModelPriceOverride:
      allOf:
        - { $ref: "#/components/schemas/TokenPriceSchedules" }
        - type: object
          required: [inputMicroUsdPerMillion, outputMicroUsdPerMillion]
          properties:
            inputMicroUsdPerMillion: { type: integer, minimum: 0 }
            cachedInputMicroUsdPerMillion: { type: integer, minimum: 0 }
            cacheWrite5mMicroUsdPerMillion: { type: integer, minimum: 0 }
            cacheWrite1hMicroUsdPerMillion: { type: integer, minimum: 0 }
            outputMicroUsdPerMillion: { type: integer, minimum: 0 }
    ConfigurationPreset:
      type: object
      additionalProperties: false
      required: [format, schemaVersion, settings]
      description: >
        Exports use schema version 6; imports accept versions 2 through 6.
        Legacy protocolMode fields are ignored. An omitted or null
        settings.routing.toolPolicy preserves the destination policy; an explicit
        pass_through policy resets it. Secrets and probe confirmations are not exported.
        Version-1 pool policies are converted automatically to version 2 after member-ID mapping.
        Missing pool policy preserves the destination policy. Import never grants additional permissions.
        Request timezone bindings are host-specific and excluded; applying a preset preserves them.
      properties:
        format: { type: string, const: zenith-relay-configuration }
        schemaVersion: { type: integer, minimum: 2, maximum: 6 }
        settings:
          type: object
          properties:
            routing:
              type: object
              properties:
                poolRouting:
                  oneOf:
                    - { $ref: "#/components/schemas/PoolRoutingPolicy" }
                    - { type: "null" }
                toolPolicy:
                  oneOf:
                    - { $ref: "#/components/schemas/ToolPolicy" }
                    - { type: "null" }
    ToolPolicy:
      type: object
      additionalProperties: false
      required: [mode]
      description: >
        Opt-in provider-native catalog optimization. pass_through sends the
        complete client catalog unchanged. automatic enables deferred schema
        loading for compatible native Responses requests, regardless of catalog
        size; it does not select or remove tools by name or infer relevance locally.
      properties:
        mode: { type: string, enum: [pass_through, automatic], default: pass_through }
    RequestTimezonePolicy:
      type: object
      additionalProperties: false
      description: >
        Fixed IANA timezone per account, or an account-specific inheritance from
        its assigned saved proxy. The fallback for an unconfigured account is
        America/New_York. accountTimezoneBindings can explicitly enable or
        disable handling for one account; missing entries inherit enabled.
        This policy does not change the system timezone.
      properties:
        enabled: { type: boolean, default: false }
        accountTimezones:
          type: object
          default: {}
          maxProperties: 10000
          propertyNames: { type: string, minLength: 1, maxLength: 256 }
          additionalProperties: { type: string, description: Exact identifier from the backend IANA catalog. }
        accountTimezoneBindings:
          type: object
          default: {}
          maxProperties: 10000
          propertyNames: { type: string, minLength: 1, maxLength: 256 }
          additionalProperties: { type: boolean, description: Explicit per-account override; missing entries inherit enabled. }
        accountTimezoneSources:
          type: object
          default: {}
          maxProperties: 10000
          propertyNames: { type: string, minLength: 1, maxLength: 256 }
          additionalProperties:
            type: string
            enum: [account, proxy]
            description: Account uses its saved timezone or the timezone of its assigned proxy.
    PoolRoutingPolicy:
      type: object
      additionalProperties: false
      required: [version, mode, members]
      description: >
        Runtime snapshots and direct updates use version 3. Direct updates must
        match the current policy version and include expectedPoolRouting.
        Preset imports accept valid version-1 and version-2 policies and migrate
        them without changing member order, shares, or concurrency limits.
        in_order and round_robin both retain equal cycling; weighted_round_robin
        opts into request shares, and failover uses primary/reserve priority.
      properties:
        version: { type: integer, enum: [1, 2, 3] }
        mode: { type: string, enum: [smart, automatic, in_order, round_robin, weighted_round_robin, failover] }
        members:
          type: array
          maxItems: 4096
          description: Ordered tagged identities; each account or source occurs once regardless of protocol count.
          items:
            type: object
            additionalProperties: false
            required: [kind, id, weight, maxConcurrency]
            properties:
              kind: { type: string, enum: [account, source] }
              id: { type: string, minLength: 1, maxLength: 256 }
              weight: { type: integer, minimum: 1, maximum: 100 }
              maxConcurrency: { type: integer, minimum: 0, maximum: 1024, description: "Shared across protocols and lanes. Zero means no additional limit." }
      oneOf:
        - properties:
            version: { const: 1 }
            mode: { enum: [smart, in_order, round_robin] }
        - properties:
            version: { const: 2 }
            mode: { enum: [automatic, in_order, round_robin] }
        - properties:
            version: { const: 3 }
            mode: { enum: [automatic, in_order, round_robin, weighted_round_robin, failover] }
    Health:
      type: object
      required: [status, version, serverId, startedAtMs]
      properties:
        status: { const: ok }
        version: { type: string }
        serverId: { type: string, minLength: 1 }
        startedAtMs: { type: integer, minimum: 0 }
    Capabilities:
      type: object
      required: [protocolVersion, compatibilityMinClient, serverName, serverId, identityFingerprint, serverManagedByUser, features, supportedWireApis, supportsAccounts, supportsSources, supportsQuota, supportsUsage, supportsLocalGateway, supportsProfileAttach, supportsWakeTasks]
      properties:
        protocolVersion: { type: integer, minimum: 1 }
        compatibilityMinClient: { type: integer, minimum: 1 }
        serverName: { type: string }
        serverId: { type: string, minLength: 1 }
        identityFingerprint: { type: string, minLength: 1 }
        serverManagedByUser: { type: boolean }
        features:
          type: array
          items: { type: string }
          uniqueItems: true
          description: >
            source_protocols_v1 enables endpoint evidence and automatic computed
            routes; the legacy diagnostic generation operation remains available
            explicitly for compatibility. route_recovery_v1 indicates that the
            existing recovery setting applies to all four text API inputs, unlike
            the older chatgpt_retry_until_available feature alone.
            tool_policy_v1 enables tool catalog policy and schema-5 presets.
            rotation_v3 enables version-3 pool rotation with optional weighted
            cycling and primary/reserve failover, including legacy-policy migration
            in schema-6 presets. Older servers advertise rotation_v2 for version-2
            policies; direct policy updates are version-exact. Management protocol
            3 requires a version-3 client; current clients can still negotiate
            protocol-2 servers without new strategies.
            request_timezone_v1 enables persisted account IANA timezone bindings,
            the backend catalog, and compare-and-set updates without rebuilding
            the runtime; portable presets exclude these host-specific bindings.
        supportedWireApis:
          type: array
          items: { type: string, enum: [responses, chat_completions, messages, gemini] }
        supportsAccounts: { type: boolean }
        supportsSources: { type: boolean }
        supportsQuota: { type: boolean }
        supportsUsage: { type: boolean }
        supportsLocalGateway: { type: boolean }
        supportsProfileAttach: { type: boolean }
        supportsWakeTasks: { type: boolean }
    SourceProviderStats:
      type: object
      required: [provider, balanceMicroUsd, spentMicroUsd, requests, totalTokens]
      properties:
        provider:
          type: string
          enum: [zenith, openrouter, sub2api, new_api, billing, deepseek, siliconflow, moonshot, unsupported]
        balanceMicroUsd: { type: [integer, "null"] }
        spentMicroUsd: { type: [integer, "null"] }
        requests: { type: [integer, "null"], minimum: 0 }
        totalTokens: { type: [integer, "null"], minimum: 0 }
        status:
          type: string
          enum: [available, unsupported, unauthorized, rate_limited, unavailable, invalid_response]
          default: available
          description: Advisory statistics state; never changes routing eligibility. Unauthorized refers to the statistics endpoint, not necessarily the inference key.
        balanceKind:
          type: string
          enum: [wallet, key_quota, subscription]
          default: wallet
        balanceUnlimited:
          type: boolean
          default: false
          description: No cap for the stated balanceKind; an unlimited key does not prove an unlimited wallet.
        amounts:
          type: array
          default: []
          description: Amounts in millionths of the stated currency or quota unit. Legacy microUSD fields contain USD only. An empty array on older servers falls back to legacy fields.
          items:
            type: object
            required: [currency, balanceMicros, spentMicros]
            properties:
              currency: { type: string, enum: [USD, CNY, CREDITS] }
              balanceMicros: { type: [integer, "null"] }
              spentMicros: { type: [integer, "null"] }
        asOfMs: { type: [integer, "null"], minimum: 0, description: Wall-clock time of the last successful statistics read. }
        stale: { type: boolean, default: false, description: Last successful observation was retained after a failed refresh or is past its refresh interval. }
        refreshError:
          type: [string, "null"]
          enum: [unauthorized, rate_limited, unavailable, invalid_response, null]
