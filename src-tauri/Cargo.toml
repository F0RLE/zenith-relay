[package]
name = "zenith-relay"
version = "1.0.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
chrono = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
sysinfo = "0.39.3"
tauri = { version = "2.11.2", features = ["image-ico", "image-png", "tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.0"
tauri-plugin-updater = "2.9.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25.12"
url = "2"
uuid = { version = "1.23.4", features = ["v4"] }
zenith-relay-core = { path = "../crates/relay-core" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
incremental = false
