<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Zenith Relay</title>
  <desc id="description">A luminous cyan and emerald sword on a dark rounded-square badge.</desc>

  <defs>
    <linearGradient id="background" x1="138" y1="78" x2="886" y2="954" gradientUnits="userSpaceOnUse">
      <stop stop-color="#223139"/>
      <stop offset="0.5" stop-color="#16242B"/>
      <stop offset="1" stop-color="#0C151B"/>
    </linearGradient>

    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(512 432) rotate(90) scale(430 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42E8D2" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#27A8B7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#27A8B7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border" x1="170" y1="90" x2="852" y2="948" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82D8C5" stop-opacity="0.72"/>
      <stop offset="0.46" stop-color="#4B9DAC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#347381" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="blade-left" x1="430" y1="142" x2="500" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1FFFD"/>
      <stop offset="0.22" stop-color="#A9F2F2"/>
      <stop offset="0.58" stop-color="#43BFD7"/>
      <stop offset="1" stop-color="#286E97"/>
    </linearGradient>

    <linearGradient id="blade-right" x1="594" y1="164" x2="536" y2="642" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFFFF0"/>
      <stop offset="0.3" stop-color="#65E6C7"/>
      <stop offset="0.68" stop-color="#25B39F"/>
      <stop offset="1" stop-color="#17727D"/>
    </linearGradient>

    <linearGradient id="blade-edge" x1="420" y1="155" x2="470" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#D2FFFF"/>
      <stop offset="1" stop-color="#75B6C5"/>
    </linearGradient>

    <linearGradient id="blade-ridge" x1="512" y1="150" x2="512" y2="638" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.27" stop-color="#C6FFF4"/>
      <stop offset="0.7" stop-color="#69DAD6"/>
      <stop offset="1" stop-color="#438E9A"/>
    </linearGradient>

    <linearGradient id="guard" x1="285" y1="598" x2="739" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#246F8C"/>
      <stop offset="0.3" stop-color="#32BCA9"/>
      <stop offset="0.52" stop-color="#4AD0B5"/>
      <stop offset="0.72" stop-color="#2DB09E"/>
      <stop offset="1" stop-color="#176D84"/>
    </linearGradient>

    <linearGradient id="guard-highlight" x1="310" y1="595" x2="714" y2="645" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AE8DA"/>
      <stop offset="0.5" stop-color="#B1F6D4"/>
      <stop offset="1" stop-color="#61C6B3"/>
    </linearGradient>

    <linearGradient id="grip" x1="480" y1="714" x2="544" y2="714" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15343D"/>
      <stop offset="0.5" stop-color="#32665F"/>
      <stop offset="1" stop-color="#12313A"/>
    </linearGradient>

    <linearGradient id="pommel" x1="476" y1="837" x2="548" y2="906" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4FFE6"/>
      <stop offset="0.42" stop-color="#56D5BF"/>
      <stop offset="1" stop-color="#277E98"/>
    </linearGradient>

    <linearGradient id="gem-setting" x1="454" y1="604" x2="570" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EE8D0"/>
      <stop offset="0.42" stop-color="#3CAEA8"/>
      <stop offset="1" stop-color="#226F89"/>
    </linearGradient>

    <linearGradient id="gem" x1="482" y1="634" x2="542" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FFF9"/>
      <stop offset="0.28" stop-color="#A8FFE0"/>
      <stop offset="0.62" stop-color="#38D6A7"/>
      <stop offset="1" stop-color="#168A86"/>
    </linearGradient>

    <filter id="sword-shadow" x="235" y="92" width="554" height="842" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#020A10" flood-opacity="0.72"/>
    </filter>

    <filter id="soft-glow" x="250" y="74" width="524" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="gem-glow" x="420" y="602" width="184" height="184" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="badge-clip">
      <rect x="48" y="48" width="928" height="928" rx="196"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge-clip)">
    <rect x="48" y="48" width="928" height="928" rx="196" fill="url(#background)"/>
    <rect x="48" y="48" width="928" height="928" rx="196" fill="url(#aura)"/>

    <!-- Minimal background accents -->
    <path d="M208 520L218 542L240 552L218 562L208 584L198 562L176 552L198 542L208 520Z"
          fill="#70EADB"
          opacity="0.55"/>

    <path d="M808 350L818 372L840 382L818 392L808 414L798 392L776 382L798 372L808 350Z"
          fill="#69B9DE"
          opacity="0.5"/>

    <path d="M748 532L756 549L773 557L756 565L748 582L740 565L723 557L740 549L748 532Z"
          fill="#69E9C9"
          opacity="0.5"/>

    <!-- Soft sword aura -->
    <path d="M512 112L612 244L580 570L512 662L444 570L412 244L512 112Z"
          fill="#42E6D1"
          opacity="0.22"
          filter="url(#soft-glow)"/>

    <g filter="url(#sword-shadow)">
      <!-- Blade silhouette -->
      <path d="M512 124L626 254L586 570L512 662L438 570L398 254L512 124Z"
            fill="#D9E8EA"/>

      <!-- Left blade facet -->
      <path d="M512 143L417 260L453 555L512 641V143Z"
            fill="url(#blade-left)"/>

      <!-- Right blade facet -->
      <path d="M512 143L607 260L571 555L512 641V143Z"
            fill="url(#blade-right)"/>

      <!-- Bright outer edges -->
      <path d="M512 143L417 260L453 555L480 600"
            stroke="url(#blade-edge)"
            stroke-width="11"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <path d="M607 260L571 555L544 600"
            stroke="#B7E7DD"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.72"/>

      <!-- Central ridge -->
      <path d="M512 146L531 263L523 558L512 641L501 558L493 263L512 146Z"
            fill="url(#blade-ridge)"/>

      <path d="M512 154L501 265L508 560L512 624V154Z"
            fill="#FFFFFF"
            opacity="0.22"/>

      <path d="M512 154L523 265L516 560L512 624V154Z"
            fill="#2BC3C5"
            opacity="0.22"/>

      <!-- Small controlled blade highlights -->
      <path d="M458 245L480 219"
            stroke="#FFFFFF"
            stroke-width="11"
            stroke-linecap="round"
            opacity="0.58"/>

      <path d="M566 247L544 220"
            stroke="#D5FFF2"
            stroke-width="10"
            stroke-linecap="round"
            opacity="0.48"/>

      <path d="M468 335L485 316"
            stroke="#B6FFF4"
            stroke-width="8"
            stroke-linecap="round"
            opacity="0.35"/>

      <!-- Grip behind the guard -->
      <path d="M480 680H544L538 840H486L480 680Z"
            fill="#102A33"/>

      <path d="M490 690H534L530 832H494L490 690Z"
            fill="url(#grip)"/>

      <path d="M492 730L532 744"
            stroke="#4CC5AD"
            stroke-width="9"
            stroke-linecap="round"/>

      <path d="M493 770L531 784"
            stroke="#4CC5AD"
            stroke-width="9"
            stroke-linecap="round"/>

      <path d="M494 810L530 824"
            stroke="#4CC5AD"
            stroke-width="9"
            stroke-linecap="round"/>

      <path d="M482 690H542V710H482Z"
            fill="#46AFA4"/>

      <path d="M489 828H535V846H489Z"
            fill="#277A7C"/>

      <!-- Pommel -->
      <path d="M512 826L558 870L512 916L466 870L512 826Z"
            fill="url(#pommel)"/>

      <path d="M512 846L536 870L512 894L488 870L512 846Z"
            fill="#123845"/>

      <path d="M512 853L529 870L512 887L495 870L512 853Z"
            fill="#8AF0D3"/>

      <!-- Symmetrical crossguard -->
      <path d="M512 620
               L451 598
               L395 620
               L333 596
               L282 582
               L315 635
               L278 660
               L372 694
               L436 672
               L512 694
               L588 672
               L652 694
               L746 660
               L709 635
               L742 582
               L691 596
               L629 620
               L573 598
               L512 620Z"
            fill="url(#guard)"/>

      <!-- Guard bevel -->
      <path d="M282 582
               L333 596
               L395 620
               L451 598
               L512 620
               L573 598
               L629 620
               L691 596
               L742 582
               L712 615
               L632 646
               L575 622
               L512 644
               L449 622
               L392 646
               L312 615
               L282 582Z"
            fill="url(#guard-highlight)"
            opacity="0.82"/>

      <!-- Guard shadow -->
      <path d="M315 635
               L372 694
               L436 672
               L512 694
               L588 672
               L652 694
               L709 635
               L632 668
               L572 646
               L512 668
               L452 646
               L392 668
               L315 635Z"
            fill="#124855"
            opacity="0.72"/>

      <!-- Central metal setting -->
      <path d="M512 594L579 661L512 728L445 661L512 594Z"
            fill="url(#gem-setting)"/>

      <path d="M512 612L560 661L512 710L464 661L512 612Z"
            fill="#123742"/>

      <!-- Gem glow -->
      <path d="M512 628L548 664L512 700L476 664L512 628Z"
            fill="#45E2B6"
            opacity="0.7"
            filter="url(#gem-glow)"/>

      <!-- Emerald gem -->
      <path d="M512 628L548 664L512 700L476 664L512 628Z"
            fill="url(#gem)"
            stroke="#B9FFE9"
            stroke-width="6"
            stroke-linejoin="round"/>

      <path d="M512 638L530 656L512 663L494 671L512 638Z"
            fill="#F2FFF9"
            opacity="0.62"/>
    </g>

    <!-- Single restrained badge rim -->
    <rect x="50" y="50" width="924" height="924" rx="194"
          stroke="url(#border)"
          stroke-width="5"/>

    <rect x="70" y="70" width="884" height="884" rx="174"
          stroke="#DFF8F2"
          stroke-width="2"
          opacity="0.12"/>
  </g>
</svg>