[package]
name = "zenith-relay-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = { level = "allow", priority = -1 }

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
cookie_store = { version = "0.22.1", default-features = false }
crypto_box = { version = "0.9.1", features = ["seal"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
futures-util = "0.3.34"
flate2 = "1.1.10"
httpdate = "1.0.3"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy"] }
jsonschema = { version = "0.60.1", default-features = false }
hex = "0.4.3"
memchr = "2.8.3"
multer = "3.1.0"
os_info = "3.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "http3", "json", "query", "rustls", "stream"] }
reqwest-websocket = "0.6.0"
regex = "1.13.1"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
semver = "1.0.28"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "time"] }
url = "2.5.8"
zstd = "0.14.3"

[dev-dependencies]
bytes = "1.12.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
