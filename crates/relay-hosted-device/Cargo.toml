[package]
name = "zenith-relay-hosted-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
hex = "0.4.3"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde"] }
zeroize = "1.9.2"
