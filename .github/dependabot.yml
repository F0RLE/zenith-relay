version: 2
updates:
  - package-ecosystem: bun
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
    groups:
      react-vite:
        patterns:
          - react
          - react-dom
          - vite
          - "@vitejs/*"
          - typescript
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      ui:
        patterns:
          - lucide-react
          - i18next
          - react-i18next
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
    groups:
      web-preview:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
    groups:
      tauri-rust:
        patterns:
          - tauri
          - tauri-*
          - tauri-build
          - keyring
  - package-ecosystem: cargo
    directory: /crates/relay-core
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
