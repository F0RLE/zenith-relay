version: 2
updates:
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
    groups:
      react-vite:
        patterns:
          - react
          - react-dom
          - vite
          - "@vitejs/*"
          - typescript
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      ui:
        patterns:
          - lucide-react
          - i18next
          - react-i18next
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
    groups:
      tauri-rust:
        patterns:
          - tauri
          - tauri-*
          - tauri-build
          - keyring
  - package-ecosystem: cargo
    directory: /crates/relay-core
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /relay-server
    schedule:
      interval: weekly
      day: monday
      time: "09:25"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /relay-server
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/Minsk
    open-pull-requests-limit: 5
