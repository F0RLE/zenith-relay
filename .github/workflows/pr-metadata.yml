name: Validate PR metadata

on:
  # Policy comes from the target branch, never from code proposed by the PR.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    # Preserve this status name for existing branch-protection rules.
    name: Release context
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            .github
            scripts/check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Test policy
        run: bun test ./scripts/check/pr-metadata.test.mjs
      - name: Require contributor agreement and release context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { validatePullRequest } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/check/pr-metadata.mjs`
            );
            const pullNumber = context.payload.pull_request.number;
            // Read current metadata, not an older event's potentially stale consent.
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            const files = pullRequest.user.type === "Bot"
              ? await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo,
                  pull_number: pullNumber,
                  per_page: 100,
                })
              : [];
            const result = validatePullRequest(pullRequest, files);
            if (result.errors.length > 0) {
              core.setFailed("PR requirements are incomplete: " + result.errors.join("; ") + ".");
            } else if (result.dependencyAutomation) {
              core.info("Dependabot maintenance: review dependency licenses and any human-authored changes before merging.");
            } else {
              core.info("Contributor confirmation and release context are present. Maintainer review of authorship and authority is still required.");
            }
