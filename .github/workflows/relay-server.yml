name: Relay Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters are not evaluated for tag pushes, so a v* tag still runs.
    paths:
      - "crates/relay-core/**"
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/relay-core/**"
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"

permissions:
  contents: read

# Cancel only an older pull request run. A tag publish or manual smoke test must finish.
concurrency:
  group: relay-server-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-server -> target
      - uses: taiki-e/install-action@cargo-audit
      - name: Prepare RustSec advisory database
        run: |
          RUSTSEC_ADVISORY_DB="$RUNNER_TEMP/rustsec-advisory-db"
          echo "RUSTSEC_ADVISORY_DB=$RUSTSEC_ADVISORY_DB" >> "$GITHUB_ENV"
          git init --quiet "$RUSTSEC_ADVISORY_DB"
          git -C "$RUSTSEC_ADVISORY_DB" remote add origin https://github.com/RustSec/advisory-db.git
          git -C "$RUSTSEC_ADVISORY_DB" fetch --depth=1 origin b4af64d3dab58bfac9d4ab23d474264ed0bb6537
          git -C "$RUSTSEC_ADVISORY_DB" checkout --detach --quiet FETCH_HEAD
      - run: cargo fmt --manifest-path relay-server/Cargo.toml --all -- --check
      - run: cargo check --manifest-path relay-server/Cargo.toml --locked
      - run: cargo clippy --manifest-path relay-server/Cargo.toml --all-targets --locked -- -D warnings
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Agent guardrails
        run: bun ./scripts/check/check-agent-guardrails.mjs
      - run: cargo test --manifest-path relay-server/Cargo.toml --locked
      - run: cargo audit --db "$RUSTSEC_ADVISORY_DB" --no-fetch --file relay-server/Cargo.lock

  smoke:
    name: Smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build native smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: zenith-relay-server:smoke
      - name: Smoke-test server container
        shell: bash
        run: |
          set -euo pipefail
          container="zenith-relay-server-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          management_token="$(openssl rand -hex 24)"
          vault_key="$(openssl rand -base64 32 | tr -d '\n')"
          docker run --detach --name "$container" \
            --publish 127.0.0.1:14999:14999 \
            --env ZENITH_RELAY_BIND=0.0.0.0:14999 \
            --env ZENITH_RELAY_DATA_DIR=/var/lib/zenith-relay \
            --env ZENITH_RELAY_PUBLIC_BASE_URL=http://127.0.0.1:14999 \
            --env ZENITH_RELAY_MANAGEMENT_TOKEN="$management_token" \
            --env ZENITH_RELAY_VAULT_KEY="$vault_key" \
            zenith-relay-server:smoke >/dev/null

          for _ in $(seq 1 30); do
            if body="$(curl --fail --silent http://127.0.0.1:14999/health 2>/dev/null)" &&
              python3 -c 'import json, sys; assert json.load(sys.stdin).get("status") == "ok"' <<<"$body"
            then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

      - name: Export checked server image
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/server-image
          docker tag zenith-relay-server:smoke "zenith-relay-server:$GITHUB_SHA"
          docker save "zenith-relay-server:$GITHUB_SHA" | gzip > .build/server-image/zenith-relay-server-linux-amd64.tar.gz
          cd .build/server-image
          sha256sum zenith-relay-server-linux-amd64.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > REVISION
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: zenith-relay-server-linux-amd64-${{ github.sha }}
          path: .build/server-image/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish server image
    needs: smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/f0rle/zenith-relay-server:${{ github.sha }}
            ghcr.io/f0rle/zenith-relay-server:${{ github.ref_name }}
