name: Relay Server

on:
  workflow_dispatch:
  push:
    branches: [main, relay/local-pool-product-modes]
    paths:
      - "crates/relay-core/**"
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/relay-core/**"
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo fmt --manifest-path relay-server/Cargo.toml --all -- --check
      - run: cargo check --manifest-path relay-server/Cargo.toml --locked
      - run: cargo clippy --manifest-path relay-server/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path relay-server/Cargo.toml --locked
      - run: cargo audit --file relay-server/Cargo.lock

  binary:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path relay-server/Cargo.toml --release --locked
      - run: |
          mkdir -p artifacts
          cp relay-server/target/release/zenith-relay-server artifacts/zenith-relay-server-${{ matrix.name }}
          sha256sum artifacts/zenith-relay-server-${{ matrix.name }} > artifacts/zenith-relay-server-${{ matrix.name }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-relay-server-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  container:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build native smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: zenith-relay-server:smoke
      - name: Smoke-test server container
        shell: bash
        run: |
          set -euo pipefail
          container="zenith-relay-server-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          management_token="$(openssl rand -hex 24)"
          vault_key="$(openssl rand -base64 32 | tr -d '\n')"
          docker run --detach --name "$container" \
            --publish 127.0.0.1:14999:14999 \
            --env ZENITH_RELAY_BIND=0.0.0.0:14999 \
            --env ZENITH_RELAY_DATA_DIR=/var/lib/zenith-relay \
            --env ZENITH_RELAY_PUBLIC_BASE_URL=http://127.0.0.1:14999 \
            --env ZENITH_RELAY_MANAGEMENT_TOKEN="$management_token" \
            --env ZENITH_RELAY_VAULT_KEY="$vault_key" \
            zenith-relay-server:smoke >/dev/null

          for _ in $(seq 1 30); do
            if body="$(curl --fail --silent http://127.0.0.1:14999/health 2>/dev/null)" &&
              python3 -c 'import json, sys; assert json.load(sys.stdin).get("status") == "ok"' <<<"$body"
            then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/f0rle/zenith-relay-server:latest
            ghcr.io/f0rle/zenith-relay-server:${{ github.sha }}
