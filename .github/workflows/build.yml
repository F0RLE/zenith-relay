name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - run: bun install --frozen-lockfile
        working-directory: src
      - name: Install Linux Tauri dependencies
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -name '*microsoft*' -o -name '*azure*' \) -delete
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - run: bunx playwright install chromium
        timeout-minutes: 10
        working-directory: src
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path crates/relay-core/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path crates/relay-core/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path crates/relay-core/Cargo.toml --locked
      - run: cargo audit --file crates/relay-core/Cargo.lock
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo audit --file relay-server/Cargo.lock
      - run: bun audit
        working-directory: src
      - name: Run verification with Linux Secret Service
        run: |
          dbus-run-session -- bash -euc '
            mkdir -p "$HOME/.local/share/keyrings"
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            bun run verify
          '
        working-directory: src
      - run: bun run test:e2e
        working-directory: src

  build:
    name: ${{ matrix.name }}
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
        working-directory: src
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -name '*microsoft*' -o -name '*azure*' \) -delete
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Run platform Rust tests
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Run Linux platform Rust tests with Secret Service
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euc '
            mkdir -p "$HOME/.local/share/keyrings"
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --manifest-path src-tauri/Cargo.toml --locked
          '
      - name: Prepare release body
        id: release_body
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $downloads = @"
          ## Downloads

          | Architecture | Windows | Ubuntu | macOS |
          |---|---|---|---|
          | x86-64 (64-bit) | [EXE](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-windows-x64.exe) · [Setup](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-windows-x64-setup.exe) · [MSI](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-windows-x64.msi) | [AppImage](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-linux-x64.AppImage) · [DEB](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-linux-x64.deb) · [RPM](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-linux-x64.rpm) | [DMG](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-macos-intel.dmg) |
          | AArch64 (ARM64) | [EXE](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-windows-arm64.exe) · [Setup](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-windows-arm64-setup.exe) · [MSI](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-windows-arm64.msi) | [AppImage](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-linux-arm64.AppImage) · [DEB](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-linux-arm64.deb) · [RPM](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-linux-arm64.rpm) | [DMG](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/zenith-relay-macos-arm64.dmg) |

          Windows: use **Setup** for normal installation, or **EXE** for a portable launch with in-place updates.

          License: [AGPL-3.0-only](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/LICENSE.txt) · [Corresponding source](${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip)
          "@
          $notes = ""
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$env:GITHUB_REF_NAME" --jq ".body"
          }
          if (-not $notes) {
            $notes = "## Changelog`n`nRelease notes are generated from the tagged commit history."
          }
          $body = "$downloads`n`n<!-- relay-notes:en -->`n$notes"
          $body | Set-Content -Path release-notes.md -Encoding utf8
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ""
          releaseDraft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
      - name: Collect and verify release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          function Copy-Required($Filter, $Destination) {
            $file = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File -Filter $Filter | Select-Object -First 1
            if (!$file) {
              throw "Missing required $env:RUNNER_OS release artifact: $Filter"
            }
            Copy-Item $file.FullName $Destination
          }
          $patterns = @("*.msi", "*.exe", "*.dmg", "*.app.tar.gz", "*.deb", "*.rpm", "*.AppImage", "*.sig", "latest.json")
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $file = $_; $patterns | Where-Object { $file.Name -like $_ } } |
            Copy-Item -Destination artifacts
          if ($env:RUNNER_OS -eq "Windows") {
            if (!(Test-Path "src-tauri/target/release/zenith-relay.exe")) {
              throw "Missing required Windows portable executable"
            }
            Copy-Item "src-tauri/target/release/zenith-relay.exe" "artifacts/zenith-relay-${{ matrix.name }}.exe"
            Copy-Required "*.msi" "artifacts/zenith-relay-${{ matrix.name }}.msi"
            Copy-Required "*setup.exe" "artifacts/zenith-relay-${{ matrix.name }}-setup.exe"
          }
          if ($env:RUNNER_OS -eq "macOS") {
            Copy-Required "*.dmg" "artifacts/zenith-relay-${{ matrix.name }}.dmg"
            Copy-Required "*.app.tar.gz" "artifacts/zenith-relay-${{ matrix.name }}.app.tar.gz"
          }
          if ($env:RUNNER_OS -eq "Linux") {
            Copy-Required "*.AppImage" "artifacts/zenith-relay-${{ matrix.name }}.AppImage"
            Copy-Required "*.deb" "artifacts/zenith-relay-${{ matrix.name }}.deb"
            Copy-Required "*.rpm" "artifacts/zenith-relay-${{ matrix.name }}.rpm"
          }
      - name: Sign portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $portable = "../artifacts/zenith-relay-${{ matrix.name }}.exe"
          bunx tauri signer sign $portable
          if (!(Test-Path "$portable.sig")) {
            throw "Portable updater signature was not created"
          }
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            if ($env:GITHUB_REF_NAME.Contains("-")) {
              gh release create $env:GITHUB_REF_NAME --target $env:GITHUB_SHA --title "Zenith Relay $env:GITHUB_REF_NAME" --notes-file release-notes.md --prerelease
            } else {
              gh release create $env:GITHUB_REF_NAME --target $env:GITHUB_SHA --title "Zenith Relay $env:GITHUB_REF_NAME" --notes-file release-notes.md
            }
          }
          Get-ChildItem "artifacts/zenith-relay-${{ matrix.name }}*" -File -ErrorAction SilentlyContinue |
            ForEach-Object { gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber }
      - name: Update release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:GITHUB_REF_NAME --target $env:GITHUB_SHA --notes-file release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-relay-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish-updater-manifest:
    name: Publish updater manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Prepare updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseNotes = (gh release view "${{ github.ref_name }}" --json body --jq ".body") -join "`n"
          if (-not $releaseNotes) {
            throw "Release notes are empty"
          }
          .github/tools/publish-updater-manifest.ps1 `
            -TagName "${{ github.ref_name }}" `
            -Repository "${{ github.repository }}" `
            -ArtifactsDir "release-artifacts" `
            -OutputDir "updater-assets" `
            -Notes $releaseNotes
          Copy-Item "LICENSE" "updater-assets/LICENSE.txt"
      - name: Upload updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem "updater-assets" -File |
            ForEach-Object { gh release upload "${{ github.ref_name }}" $_.FullName --clobber }
