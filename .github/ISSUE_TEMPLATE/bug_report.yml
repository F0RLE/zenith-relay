name: Bug report
description: Report a reproducible problem in Zenith Relay
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove secrets, access tokens, account data, and full request or response bodies from all diagnostics.
  - type: input
    id: version
    attributes:
      label: Zenith Relay version
      description: Include the release version, commit SHA, or build identifier.
      placeholder: 1.1.0 or v1.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Relay Server
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Add redacted error messages, timestamps, and relevant logs. Do not include secrets or prompts.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Report checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, tokens, personal data, prompts, and response bodies.
          required: true

