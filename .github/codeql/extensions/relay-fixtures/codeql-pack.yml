# Only exact cfg(test) trusted-path adapters are modeled: exclusively reserved
# private fixtures, their validated parent-to-child test channel, and explicit
# same-user paths for ignored read-only public-catalog probes. Generic readers,
# environment functions, production inputs and similarly named helpers stay
# unmodeled. The catalog selectors are trusted operator choices, not sanitizers.
# The optional FIFO root has both whole-value and Some-payload flows in CodeQL.
name: f0rle/zenith-relay-fixtures
version: 0.0.1
library: true
extensionTargets:
  codeql/rust-all: ^0.2.24
dataExtensions:
  - models/*.json
