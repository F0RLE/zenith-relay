version = 1
name = "Zenith Relay development"

# Opening a chat/worktree must not install dependencies or start the app.
[setup]
script = ""

[[actions]]
name = "Relay · Dev"
icon = "run"
command = "bun run app:dev"

[[actions]]
name = "Relay · TypeScript"
icon = "debug"
command = "bun run --cwd src check"

[[actions]]
name = "Relay · UI tests"
icon = "test"
command = "bun run --cwd src test:unit"

[[actions]]
name = "Relay · Rust check"
icon = "debug"
command = "bun scripts/build/cargo.mjs check --manifest-path src-tauri/Cargo.toml --locked"
