version = 1
name = "Zenith Relay development"

# Dependencies and the app are started only by an explicit action.
[setup]
script = ""

[[actions]]
name = "Relay · Dev"
icon = "run"
command = "bun run app:dev"

[[actions]]
name = "Relay · TypeScript"
icon = "debug"
command = "bun run --cwd src check"

[[actions]]
name = "Relay · UI tests"
icon = "test"
command = "bun run --cwd src test:unit"

[[actions]]
name = "Relay · Rust check"
icon = "debug"
command = "bun scripts/build/cargo.mjs check --manifest-path src-tauri/Cargo.toml --locked"

[[actions]]
name = "Relay · Docs check"
icon = "tool"
command = "bun run --cwd src check:docs"

[[actions]]
name = "Relay · Setup dependencies"
icon = "tool"
command = "bun run setup"
